[project]
name = "calc"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "sqlalchemy>=2.1.6",
    "testy",
]

[tool.uv.sources]
testy = { path = "../..", editable = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

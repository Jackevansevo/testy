[project]
name = "testy"
version = "0.1.1"
description = "A small, fast test runner that skips unchanged tests and runs files in parallel"
readme = "README.md"
authors = [
    { name = "Jack Evans", email = "jack.william.evans@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "rich>=15.0.0",
    "ruff>=0.17.3",
]

[project.scripts]
testy = "testy:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
]
